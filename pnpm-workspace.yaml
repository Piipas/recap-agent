packages:
  - "apps/*"
  - "packages/*"

# npm-style flat node_modules. The CLI's `tsc` emits declarations for its exported
# Octokit instance, which only works when octokit's dependencies resolve as real,
# top-level packages, as they did under npm. The root devDependency
# `@octokit/plugin-paginate-rest@14.0.0` reproduces npm's placement of that package
# (the version `octokit` itself depends on), without touching packages/cli.
nodeLinker: hoisted

allowBuilds:
  "@prisma/engines": true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@next/eslint-plugin-next@16.4.1"
  - dotenv@18.0.8
  - eslint-config-next@16.4.1
  - "@better-auth/core@1.7.8"
  - "@better-auth/drizzle-adapter@1.7.8"
  - "@better-auth/kysely-adapter@1.7.8"
  - "@better-auth/memory-adapter@1.7.8"
  - "@better-auth/mongo-adapter@1.7.8"
  - "@better-auth/prisma-adapter@1.7.8"
  - "@better-auth/telemetry@1.7.8"
  - "@next/env@16.4.1"
  - "@next/swc-darwin-arm64@16.4.1"
  - "@next/swc-darwin-x64@16.4.1"
  - "@next/swc-linux-arm64-gnu@16.4.1"
  - "@next/swc-linux-arm64-musl@16.4.1"
  - "@next/swc-linux-x64-gnu@16.4.1"
  - "@next/swc-linux-x64-musl@16.4.1"
  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"
  - better-auth@1.7.8
  - lucide-react@1.57.0
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
  - resend@6.33.0
